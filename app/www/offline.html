<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Touchline Tales</title>
<style>
  html,body{margin:0;height:100%;background:#0E2A1D;color:#F6F3EA;font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box}
  img{width:96px;height:96px;margin-bottom:20px}
  h1{font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px}
  p{margin:0 0 24px;max-width:320px;opacity:.85}
  button{font:inherit;font-weight:700;background:#F2C230;color:#0E2A1D;border:0;border-radius:12px;padding:14px 28px}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>No connection</h1>
  <p>Touchline Tales needs the internet to show your team. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.href='https://touchlinetales.club/app/'">Try again</button>
</main>
</body>
</html>
