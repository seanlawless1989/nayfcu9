<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16239E">
<meta name="description" content="Manage Newton Aycliffe Youth U9s girls through a season.">
<meta name="robots" content="noindex,nofollow,noimageindex,noarchive,nosnippet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="U9s Manager">
<title>Aycliffe U9s Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Luckiest+Guy&family=Archivo:wght@400;500;600;800&display=swap">
<style>
/* Layout: club masthead (same identity as the U9s Hub) over a tab strip; one screen at a time; the live match takes over the page */
:root{
  --bg:#F2F4FB; --card:#FFFFFF; --ink:#121733; --muted:#5A6283; --line:#DADEEE; --field:#F8F9FE;
  --club:#2235E8; --clubDeep:#16239E; --clubInk:#FFFFFF; --gold:#FFD200; --goldInk:#1A1A1A;
  --win:#1C8A44; --draw:#B07A00; --loss:#C0262D; --pink:#E94E9E; --warn:#FFF1C7; --warnInk:#7A5300;
  --grass1:#3E9B4F; --grass2:#358A45; --chalk:rgba(255,255,255,.75);
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shirt:"Luckiest Guy","Arial Black",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --card:#161B31; --ink:#EDEFF9; --muted:#A1A8C8; --line:#283050; --field:#1C2240;
  --club:#5C6CFF; --clubDeep:#1B2577; --clubInk:#FFFFFF; --gold:#FFD84A; --goldInk:#1A1A1A;
  --win:#4CC27A; --draw:#E2B33D; --loss:#FF6B6B; --pink:#F57DBA; --warn:#3A3216; --warnInk:#F4D37A;
  --grass1:#24683A; --grass2:#1E5B32; --chalk:rgba(255,255,255,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1120; --card:#161B31; --ink:#EDEFF9; --muted:#A1A8C8; --line:#283050; --field:#1C2240;
  --club:#5C6CFF; --clubDeep:#1B2577; --clubInk:#FFFFFF; --gold:#FFD84A; --goldInk:#1A1A1A;
  --win:#4CC27A; --draw:#E2B33D; --loss:#FF6B6B; --pink:#F57DBA; --warn:#3A3216; --warnInk:#F4D37A;
  --grass1:#24683A; --grass2:#1E5B32; --chalk:rgba(255,255,255,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--clubDeep);color:var(--clubInk);border-bottom:6px solid var(--gold)}
.mast .wrap{padding-block:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.crest{width:64px;height:64px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:3px}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,3.6vw,28px);line-height:1.05;margin:0;text-wrap:balance}
.mast p{margin:3px 0 0;font-size:13px;opacity:.85}
.mast .when{margin-left:auto;text-align:right;font-size:13px}
.mast .when b{display:block;font:400 18px var(--display)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:12px 0}
nav.tabs button{font:600 14px var(--body);padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--club);border-color:var(--club);color:var(--clubInk)}
nav.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--pink);color:#fff;font-size:11.5px;margin-left:4px}
main{padding-block:16px 60px}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px;text-wrap:balance}
h3{font:800 12px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.hint{font-size:13px;color:var(--muted);margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:700 15px var(--body);padding:11px 18px;border-radius:10px;border:0;background:var(--club);color:var(--clubInk);cursor:pointer}
.btn.gold{background:var(--gold);color:var(--goldInk)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{font-size:13px;padding:7px 12px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 13.5px var(--body);border:0;background:var(--field);color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--club);color:var(--clubInk)}
select{font:15px var(--body);color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
.note{padding:10px 12px;border-radius:10px;background:var(--warn);color:var(--warnInk);font-size:13.5px}
.chip{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;font:800 12.5px var(--body);color:#fff}
.chip.W{background:var(--win)}.chip.D{background:var(--draw)}.chip.L{background:var(--loss)}.chip.N{background:var(--muted)}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--gold);color:var(--goldInk);font:400 14px var(--shirt);flex:none;padding-top:2px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:700 11px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:right;padding:6px 7px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl tr.us td{background:color-mix(in srgb,var(--gold) 22%,transparent);font-weight:700}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--field)}
.scroll{overflow-x:auto}
.pname{display:flex;align-items:center;gap:8px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--club)}
.bar.good i{background:var(--win)}.bar.mid i{background:var(--draw)}.bar.bad i{background:var(--loss)}
.badgeT{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font:400 10.5px var(--display);color:#fff;flex:none;letter-spacing:.02em}
.badgeT.big{width:56px;height:56px;font-size:16px}
.crestS{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:50%;padding:1px;flex:none}
.crestS.big{width:56px;height:56px;padding:2px}
.fx{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.fx .d{font:700 12px var(--body);color:var(--muted);line-height:1.2}
.fx .t{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.fx .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx .s{font:400 20px var(--display);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.fx.next{border:2px solid var(--club)}
.comp{font:700 10.5px var(--body);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:var(--field);color:var(--muted)}
.comp.T{background:var(--pink);color:#fff}
.comp.C{background:var(--gold);color:var(--goldInk)}
.hero{background:var(--club);color:var(--clubInk);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;border:0}
.hero h3{color:inherit;opacity:.8}
.vs{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vs .nm{font:400 clamp(18px,3.5vw,26px) var(--display);line-height:1.1}
.vs .sub{font-size:13px;opacity:.85}
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.msg{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.msg.unread{border-left:4px solid var(--pink)}
.msg .f{font-size:12px;color:var(--muted);font-weight:700}
.msg .s{font-weight:700}
.msg .b{font-size:14px;color:var(--ink);white-space:pre-line}
/* pitch */
.pitch{position:relative;width:100%;max-width:440px;aspect-ratio:3/4;border-radius:12px;overflow:hidden;margin:0 auto;
  background:repeating-linear-gradient(180deg,var(--grass1) 0 12.5%,var(--grass2) 12.5% 25%)}
.pitch::before{content:"";position:absolute;inset:4%;border:2px solid var(--chalk);border-radius:2px}
.pitch::after{content:"";position:absolute;left:4%;right:4%;top:50%;border-top:2px solid var(--chalk)}
.pitch .box{position:absolute;left:30%;right:30%;height:12%;border:2px solid var(--chalk)}
.pitch .box.top{top:4%;border-top:0}.pitch .box.bot{bottom:4%;border-bottom:0}
.pitch .circ{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid var(--chalk);border-radius:50%;transform:translate(-50%,-50%)}
.pitch .net{position:absolute;left:40%;right:40%;height:3.6%;border:2.5px solid #fff;z-index:1;
 background:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 1px,transparent 1px 5px),rgba(0,0,0,.18)}
.pitch .net.top{top:.6%;border-bottom:0;border-radius:4px 4px 0 0}.pitch .net.bot{bottom:.6%;border-top:0;border-radius:0 0 4px 4px}
.pitch .net.bulge{animation:netBulge .6s ease-out 2}
@keyframes netBulge{50%{transform:scale(1.18,1.5);background-color:rgba(255,210,0,.5)}}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:0;width:78px;color:#fff;font:inherit;z-index:2}
.tok .sh{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#16239E;font:400 18px var(--shirt);padding-top:3px;border:3px solid #16239E;box-shadow:0 3px 8px rgba(0,0,0,.3);position:relative}
.tok.gk .sh{background:#E94E9E;color:#fff;border-color:#fff}
.tok .nm{font:700 12px var(--body);background:rgba(10,16,50,.72);padding:1px 6px;border-radius:5px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tok .rl{font:800 9.5px var(--body);letter-spacing:.06em;opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tok.sel .sh{outline:4px solid #fff;outline-offset:2px}
.tok.off .sh{opacity:.7;border-style:dashed}
.tok .cap{position:absolute;top:-6px;right:-8px;width:18px;height:18px;border-radius:50%;background:#fff;color:#16239E;font:800 10px var(--body);display:grid;place-items:center;padding:0}
.tok .cond{width:40px;height:4px;border-radius:2px;background:rgba(0,0,0,.35);overflow:hidden}
.tok .cond i{display:block;height:100%;background:#7CFC9A}
.tok.empty .sh{background:rgba(255,255,255,.2);color:#fff;border:2px dashed #fff}
.ball{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #111 inset,0 2px 4px rgba(0,0,0,.4);transform:translate(-50%,-50%);transition:left .45s ease,top .45s ease;z-index:3}
.mp .dot{position:absolute;transform:translate(-50%,-50%);will-change:left,top;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;padding:0;border:2px solid rgba(0,0,0,.45);box-shadow:0 2px 5px rgba(0,0,0,.35);z-index:2;font:inherit}
.mp .dot .n{font:400 12.5px var(--shirt);line-height:1;padding:4px 3px 2px;border-radius:5px}
.mp .dot.us{background:#FFD200;color:#16239E;border-color:#16239E;cursor:pointer}
.mp .dot.us.gk{background:#E94E9E;color:#fff;border-color:#fff}
.mp.pinkopp .dot.us.gk{background:#1FA855}
.mp .dot.them .n{min-width:16px;text-align:center}
.mp .dot.us .lb{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;font:700 10.5px var(--body);color:#fff;background:rgba(10,16,50,.72);padding:0 5px;border-radius:4px;white-space:nowrap;pointer-events:none}
.mp .dot.sel{outline:3px solid #fff;outline-offset:2px}
.mp .dot.empty{background:rgba(255,255,255,.25);border-style:dashed;border-color:#fff;color:#fff}
.mp .ball{transition:none;width:12px;height:12px;z-index:4}
.mp{background:repeating-linear-gradient(180deg,var(--grass1) 0 6.25%,var(--grass2) 6.25% 12.5%);box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.pitch .six{position:absolute;left:40%;right:40%;height:5%;border:2px solid var(--chalk)}
.pitch .six.top{top:4%;border-top:0}.pitch .six.bot{bottom:4%;border-bottom:0}
.pitch .spot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--chalk)}
.mp .bsh{position:absolute;width:12px;height:6px;border-radius:50%;background:#000;opacity:.4;transform:translate(-50%,-50%);z-index:2;pointer-events:none}
.mp .dot.has{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 2px 6px rgba(0,0,0,.4)}
.mp .onball{position:absolute;left:8px;bottom:8px;z-index:5;font:700 12px var(--body);color:#fff;background:rgba(10,16,50,.78);padding:3px 8px;border-radius:6px;pointer-events:none}
.mp .onball::before{content:"⚽ "}
.zone{position:absolute;width:40%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;transition:background .4s;z-index:1}
.zone.us{background:radial-gradient(circle,rgba(255,210,0,.38),rgba(255,210,0,0) 68%)}
.zone.them{background:radial-gradient(circle,rgba(255,90,90,.36),rgba(255,90,90,0) 68%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(0,0,0,.35)}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bp{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;font:inherit;color:inherit;text-align:left;min-width:0}
.bp.sel{border-color:var(--club);box-shadow:0 0 0 2px var(--club)}
.bp.na{opacity:.55;cursor:default}
.bp .x{display:flex;flex-direction:column;min-width:0}
.bp .x b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bp .x small{color:var(--muted);font-size:12px}
.att{display:grid;grid-template-columns:96px minmax(0,1fr) 30px 16px;gap:8px;align-items:center;font-size:13.5px}
.att .v{font:400 15px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--win);font-weight:800}
.pcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pcard .big{display:grid;place-items:center;width:72px;height:72px;border-radius:16px;background:var(--gold);color:#16239E;font:400 38px var(--shirt);padding-top:5px;border:4px solid #16239E}
.trait{display:inline-block;font:700 12px var(--body);padding:3px 8px;border-radius:6px;background:var(--field);border:1px solid var(--line)}
.face{font-size:18px}
.na-tag{display:inline-block;font:700 11px var(--body);background:var(--warn);color:var(--warnInk);border-radius:6px;padding:2px 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);cursor:pointer;text-align:left;font:inherit;color:inherit}
.opt b{font-size:15px}.opt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--club);background:var(--card);box-shadow:0 0 0 2px var(--club)}
/* match */
.mview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.mview{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--clubDeep);color:#fff;border-radius:16px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;border-bottom:5px solid var(--gold)}
.board .side{display:flex;align-items:center;gap:8px;min-width:0;font:700 14px var(--body)}
.board .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .side.r{justify-content:flex-end;text-align:right}
.board .sc{font:400 40px var(--display);font-variant-numeric:tabular-nums;text-align:center;line-height:1}
.board .clk{display:block;font:700 12px var(--body);opacity:.85;margin-top:4px;text-align:center}
.poss{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.poss i{display:block;background:var(--club);transition:width .4s}
.feed{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;padding-right:4px}
.ev{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;font-size:14px;padding:6px 8px;border-radius:8px}
.ev .m{font:800 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.ev.goal{background:color-mix(in srgb,var(--gold) 35%,transparent);font-weight:700}
.ev.them{background:color-mix(in srgb,var(--loss) 14%,transparent)}
.ev.brk{background:var(--field);font-weight:700}
.ev.chance{background:color-mix(in srgb,var(--club) 12%,transparent)}
.ev.danger{background:color-mix(in srgb,var(--loss) 9%,transparent)}
.ev.shot{font-weight:700}
.ev.save{background:color-mix(in srgb,var(--win) 14%,transparent)}
.flash.chance{border-color:var(--club);background:color-mix(in srgb,var(--club) 14%,var(--card))}
.flash.danger{border-color:var(--loss);background:color-mix(in srgb,var(--loss) 10%,var(--card))}
.flash.shot{border-color:var(--gold);border-width:3px}
.flash.shot.anim{animation:shotPulse .4s ease-in-out 4 alternate}
.flash.save{border-color:var(--win);background:color-mix(in srgb,var(--win) 14%,var(--card))}
@keyframes shotPulse{0%{transform:scale(1)}100%{transform:scale(1.035)}}
.ev.shout{font-style:italic;background:color-mix(in srgb,var(--pink) 12%,transparent)}
.flash.shout{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 12%,var(--card))}
.shouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:520px){.shout small{display:none}.shout.on small{display:block}.shout{padding:8px}}
.shout{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.shout b{font-size:14.5px}.shout small{font-size:12px;color:var(--muted);line-height:1.3}
.shout:hover:not(:disabled){border-color:var(--pink)}
.shout.on{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink);background:var(--card)}
.shout:disabled{opacity:.5;cursor:default}
.ev.new{animation:evFlash 1.2s ease-out}
@keyframes evFlash{0%,40%{background:var(--club);color:var(--clubInk)}100%{}}
.flash{display:flex;gap:12px;align-items:center;border-radius:14px;padding:14px 16px;font:400 clamp(17px,3.6vw,24px)/1.2 var(--display);background:var(--card);border:2px solid var(--club);color:var(--ink);min-height:64px}
.roll{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--muted);padding:0 4px;margin-bottom:-8px}
.roll div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roll span{font-weight:800;font-variant-numeric:tabular-nums}

  const ids=shuffle([US,...S.leagueIds]);if(ids.length%2)ids.push("bye");const n=ids.length;const rounds=[];

  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];pr.push(r%2?[b,a]:[a,b])}rounds.push(pr);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}

  S.league=all.map(r=>r.filter(([h,a])=>h!=="bye"&&a!=="bye").map(([h,a])=>({h,a,hs:null,as:null})));

  if(!eight.some(p=>p.pos.includes("GK"))){const k=av.filter(p=>p.pos.includes("GK")).sort((a,b)=>roleOvr(b,"GK")-roleOvr(a,"GK"))[0];if(k){eight.pop();eight.push(k)}}

  form.forEach(slot=>{let best=null,bv=-1;for(const p of eight){if(used.has(p.id))continue;const v=fitFor(p,slot);if(v>bv){bv=v;best=p}}if(best){used.add(best.id);xi.push(best.id)}else xi.push(null)});

    towWhy:tow?pick([`Worked her socks off in every drill.`,`Listened brilliantly and helped the others.`,`Her ${t.n.toLowerCase()} was the best it's been all season.`,`Never stopped smiling and never stopped running.`,`First to arrive, last to leave, and tidied up the cones.`,`Tried something new and nailed it.`]):"",

// ---------------- match engine ----------------
function eff(p,k,cond,fam){return p.a[k]*(.72+.28*cond/100)*(.9+.2*p.morale/100)*fam}
function unitStr(list){ // list of {role, get(k)}
  let atk=0,ctl=0,def=0,gk=1;
  for(const u of list){const g=u.get;
    if(u.role==="GK"){gk=g("GK");ctl+=g("PAS")*.2;continue}
    if(u.role==="ATT"){atk+=g("SHO")*.45+g("DRI")*.3+g("PAC")*.25;ctl+=(g("DRI")*.5+g("TEA")*.5)*.4;def+=g("TAC")*.15}
    if(u.role==="MID"){atk+=(g("PAS")*.4+g("DRI")*.3+g("SHO")*.3)*.55;ctl+=g("PAS")*.45+g("TEA")*.3+g("STA")*.25;def+=g("TAC")*.45}
    if(u.role==="DEF"){atk+=g("PAS")*.15;ctl+=(g("PAS")*.5+g("TEA")*.5)*.4;def+=g("TAC")*.5+g("PAC")*.3+g("TEA")*.2}
  }

function ourStr(){

  M.xi.forEach((id,i)=>{if(!id)return;const p=P(id),role=form[i][0];const fam=Math.max(.6,famFor(p,form[i]));
    list.push({role,get:k=>eff(p,k,M.cond[id],fam)})});
  const s=unitStr(list);const m=M.ment;s.atk*=[.85,1,1.15][m];s.def*=[1.15,1,.86][m];
  s.atk*=M.mod.atk;s.def*=M.mod.def;s.ctl*=M.mod.ctl;
  const sh=shoutOn(),pw=shoutPow();
  if(sh==="encourage"){s.atk*=1+.06*pw;s.def*=1+.06*pw;s.ctl*=1+.06*pw}
  if(sh==="praise"){const b=(M.us>=M.them?.07:.03)*pw;s.atk*=1+b;s.def*=1+b;s.ctl*=1+b}
  if(sh==="pass")s.ctl*=1+.18*pw;
  if(sh==="back"){s.def*=1+.2*pw;s.atk*=.9}
  if(sh==="breathe"){s.def*=1+.04*pw;s.ctl*=1+.04*pw}
  if(M.xi.some(x=>!x)){s.atk*=.8;s.def*=.8}
  return s;
}

// team talks: returns what the girls make of it
function doTalk(phase,k){
  const diff=M.us-M.them,fav=M.oppStr<best7Str()-1,dog=M.oppStr>best7Str()+1;
  let mo=0,fu=0,react="",mod=null;
  if(phase==="pre"){
    if(k==="enjoy"){fu=5;mo=2;react="Big smiles all round. They run out laughing."}
    if(k==="win"){if(dog){mo=-3;fu=-1;react="A few nervous faces. They know this lot are good."}else{mo=5;react="Fists pumped. They're up for it.";mod={atk:1.04}}}
    if(k==="brave"){mo=3;fu=2;react="Nods all round. They want to show what they can do.";mod={atk:1.03,ctl:1.02}}
    if(k==="together"){mo=3;react="They huddle up and do the team chant.";mod={ctl:1.04,def:1.03}}
  }
  if(phase==="ht"){
    if(k==="fun"){fu=5;mo=diff<0?1:3;react="They relax and start giggling again."}
    if(k==="proud"){mo=diff>=0?5:4;fu=3;react=diff>=0?"Beaming faces. They're loving it.":"Heads come up a bit."}
    if(k==="focus"){mo=2;react="They nod. Pass, move, pass.";mod={ctl:1.06}}
    if(k==="effort"){if(diff<0){mo=2;fu=-2;react="They look determined. Socks pulled up.";mod={atk:1.06,def:1.03}}else{mo=-4;fu=-4;react="A few confused looks. They thought it was going well."}}
  }
  if(phase==="ft"){
    const r=M.res;
    if(k==="well"){if(r==="L"&&M.them-M.us>=3){mo=1;react="They know it wasn't their best, but they like hearing it."}else{mo=5;fu=4;react="Cheers and high fives."}}
    if(k==="proud"){mo=4;fu=4;react=r==="L"?"A few tears dried. They feel better.":"Lots of hugs."}
    if(k==="learn"){mo=r==="L"?3:0;fu=0;react="They're already asking what drills they'll do.";S.talkBoost=(S.talkBoost||0)+1}
    if(k==="notgood"){if(r==="W"){mo=-6;fu=-7;react="Faces drop. They won, so they're confused."}else{mo=-4;fu=-6;react="Quiet car journeys home. One or two in tears."}}
  }
  const sc=M.comp==="T"||M.comp==="F"?.4:.7;
  M.squad.forEach(id=>{const p=P(id);const k=(M.mins[id]||phase==="pre"?1:.5)*sc;p.morale=clamp(p.morale+mo*k,0,100);p.fun=clamp(p.fun+fu*k,0,100)});
  if(mod)for(const[a,v] of Object.entries(mod))M.mod[a]*=v;
  M.talks[phase]=k;M.talkSaid={phase,text:TALKS[phase].find(x=>x[0]===k)[1],react};M.dec.push({k:"talk",min:M.min,phase,text:M.talkSaid.text,react,mo,mod});
  feed(`🗣️ Team talk: "${M.talkSaid.text}" ${react}`,"shout");
}

  const gain=S.players.reduce((a,p)=>a+(ovr(p)-ovrStart(p)),0)/S.players.length;

  const t=tableRows().find(r=>r.id===US);const ppg=t.P?t.Pts/t.P:1.3;B.res=clamp(Math.round(50+(ppg-1.3)*32+(S.trophies||[]).filter(x=>x.season===seasonStr()).length*4),0,100);

function tourTable(t){

  t.fx.forEach(x=>{if(x.hs==null)return;const h=rows[x.h],a=rows[x.a];h.P++;a.P++;h.F+=x.hs;h.A+=x.as;a.F+=x.as;a.A+=x.hs;
    if(x.hs>x.as){h.W++;a.L++;h.Pts+=3}else if(x.hs<x.as){a.W++;h.L++;a.Pts+=3}else{h.D++;a.D++;h.Pts++;a.Pts++}});

function simGoals(a,b,home){const sa=team(a)?team(a).str:best7Str()*.98,sb=team(b)?team(b).str:best7Str()*.98;return [poisson(2.6*Math.pow(sa/sb,2.3)*(home?1.06:1)),poisson(2.6*Math.pow(sb/sa,2.3))]}

  $("#when").textContent=S.seasonOver?`Season over · ${seasonStr()}`:fmt(curDate());
  $("#mastSub").textContent=CH?`Challenge: ${CHAL.find(c=>c.id===CH.id).n}`:`${S.manager?`${S.manager} · `:""}Under ${S.age}s · ${divName()} · ${seasonStr()}`;
  const unread=S.inbox.filter(m=>!m.read).length;
  $("#bell").innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>${unread?`<span class="badge">${unread}</span>`:""}`;
  $("#bell").setAttribute("aria-label",unread?`Messages, ${unread} new`:"Messages");
  document.body.classList.toggle("inmatch",view==="match"&&!!M);

  $("#tabs").innerHTML=TABS.map(([g,n,v])=>`<button data-view="${v}" aria-current="${g===grp?"page":"false"}">${svgI(g)}${n}</button>`).join("");
  const main=$("#main");
  main.classList.add("hasbar");
  if(view==="match"&&M){renderMatch();return}
  if(view==="match")view="home";
  const sub=SUBTABS[GROUP[view]];
  main.innerHTML=(sub&&!(view==="squad"&&playerView)?`<nav class="subtabs" aria-label="${GROUP[view]==="team"?"Team":"Games"}">${sub.map(([v,n])=>`<button data-view="${v}" aria-current="${v===view?"page":"false"}">${n}</button>`).join("")}</nav>`:"")+
    ({home:homeV,squad:squadV,tactics:tacticsV,training:trainingV,gametime:gameTimeV,fixtures:fixturesV,table:tableV,cup:cupV,tours:toursV,inbox:inboxV,club:clubV}[view]||homeV)()+
    (S.guide===0?guideIntro():"");
  setBar();
}
function compLabel(comp,round){return comp==="L"?`League · Round ${round+1}`:comp==="C"?`County Cup · ${CUPNAME[round]}`:S.tours[round].name}
function fxRow(f,comp,date,round,isNext){
  const usH=f.h===US;const opp=usH?f.a:f.h;const done=f.hs!=null;
  let r="";if(done){const u=usH?f.hs:f.as,t=usH?f.as:f.hs;let res=u>t?"W":u<t?"L":"D";if(f.pens){const pu=usH?f.pens[0]:f.pens[1],pt=usH?f.pens[1]:f.pens[0];res=pu>pt?"W":"L"}r=`${u}–${t}<span class="chip ${res}">${res}</span>`}
  return `<div class="fx${isNext?" next":""}"><div class="d">${fmt(date).replace(" ","<br>")}</div>
   <div style="min-width:0;display:flex;flex-direction:column;gap:3px"><div class="t">${badge(opp)}<span>${usH?"v":"at"} ${esc(teamName(opp))}</span></div>
   <div><span class="comp ${comp}">${compLabel(comp,round)}</span>${f.pens?` <span class="hint">pens ${usH?f.pens[0]:f.pens[1]}-${usH?f.pens[1]:f.pens[0]}</span>`:""}</div></div>
   <div class="s">${done?r:isNext?`<span class="chip N">Next</span>`:""}</div></div>`;
}
const GHOST=`class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.4)"`;
function weekStrip(){
  const ev=curEvent();const sat=ev.type==="T"?"Tourn.":!ourFixture(ev).f?"Rest":"Match";
  return `<div class="days" aria-label="This week">${DAYS.map((d,i)=>`<span class="${i===S.day?"on":i<S.day?"done":""}">${d}<small>${i===3?"Train":i===6?sat:i===1?"News":"&nbsp;"}</small></span>`).join("")}</div>`;
}
function scorerLine(log,side){return log.filter(g=>g.side===side).map(g=>`${esc(g.name)} ${g.min}'${g.ast?` <small>(${esc(g.ast)})</small>`:""}`).join(", ")}
function satPreview(){
  const ev=curEvent(),of=ourFixture(ev);
  if(ev.type==="T")return `Saturday: the ${esc(S.tours[ev.round].name)}, a one-day tournament.`;
  if(!of.f)return ev.type==="L"?`Saturday: our bye week in the league.`:`Saturday: no game for us. We're out of the County Cup.`;
  const opp=of.f.h===US?of.f.a:of.f.h;return `Saturday: ${of.comp==="C"?`County Cup ${CUPNAME[ev.round].toLowerCase()}`:"League"} ${of.f.h===US?"at home to":"away at"} ${esc(team(opp).name)}.`;
}
function heroV(){
  const ev=curEvent(),of=ourFixture(ev);const d=S.day;
  const head=`<h3>Week ${S.wk+1} of ${S.cal.length}</h3>${weekStrip()}`;
  const todays=S.inbox.filter(m=>m.date===curDate()&&m.from!=="Match report"&&m.from!=="Tournament report");
  const notes=[...S.today.map(t=>`<div class="note tip">${esc(t)}</div>`),...todays.slice(0,4).map(m=>`<button class="msg" data-msg="${m.id}" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff"><span class="f" style="color:rgba(255,255,255,.75)">${esc(m.from)}${m.read?"":" · new"}</span><span class="s">${esc(m.subj)}</span></button>`)].join("");
  const towLine=S.trainRep&&S.trainRep.tow&&d>3?`<p style="margin:0">⭐ Trainer of the week: <b>${esc(P(S.trainRep.tow).name)}</b></p>`:"";

  if(d===3){
    if(!S.trained){const sg=suggestion();
      return `<section class="card hero">${head}<div class="nm" style="font:400 26px var(--display)">Training night</div>
       <div class="note tip"><b>Coach's suggestion: ${TRAIN[sg.k].n}.</b> ${esc(sg.why)}</div>
       <div class="opts">${Object.entries(TRAIN).map(([k,t])=>`<button class="opt" data-train="${k}" aria-pressed="${k===S.train.focus}"><b>${t.n}${k===sg.k?" ⭐":""}</b><small>${t.d}</small></button>`).join("")}</div>
       <div class="seg" role="group" aria-label="Intensity">${["Light","Normal","Hard"].map((n,i)=>`<button data-int="${i}" aria-pressed="${i===S.train.int}">${n}</button>`).join("")}</div>
       <p class="hint" style="color:inherit;opacity:.85">${["Light: slower progress, fresh legs, happier girls.","Normal: steady progress.","Hard: faster progress, but tired legs on Saturday and less fun."][S.train.int]}</p>
       ${notes}</section>`}
    const r=S.trainRep;
    return `<section class="card hero">${head}<div class="nm" style="font:400 26px var(--display)">Training report</div>
     ${r.tow?`<div class="vs"><div class="pcard" style="gap:12px"><div class="big" style="background:var(--gold);color:#16239E">${P(r.tow).num}</div><div><div style="font:400 20px var(--display)">⭐ Trainer of the week</div><div class="nm">${esc(P(r.tow).name)}</div><div class="sub">${esc(r.towWhy)}</div></div></div></div>`:""}
     <p style="margin:0">${esc(r.focus)}, ${esc(r.int)}. ${esc(r.line)}</p>
     <p style="margin:0">${r.ups.length?`Getting better: ${esc(r.ups.slice(0,8).join(", "))}${r.ups.length>8?` and ${r.ups.length-8} more`:""}.`:"No attributes ticked up this week, but it all adds up."} ${r.funD>0?"Lots of fun had.":r.funD<0?"A few tired faces at the end.":""}</p>
     ${r.rows?`<div class="btns"><button ${GHOST} data-act="trainsheet">See who improved and why</button></div>`:""}
     ${notes}</section>`;
  }
  // Saturday
  if(d===6){
    if(ev.type==="T")return tourHero(ev,head);
    if(!of.f)return `<section class="card hero">${head}<div class="nm" style="font:400 22px var(--display)">No match for us this week</div><p class="hint" style="color:inherit;opacity:.85">${ev.type==="L"?"It's our bye week in the league.":"We're out of the cup."} The girls have a Saturday off.</p></section>`;
    const opp=of.f.h===US?of.f.a:of.f.h;const t=team(opp);const pos=tableRows().findIndex(r=>r.id===opp)+1;
    const diff=t.str-best7Str();const scout=diff>1.5?"A strong side. Keeping it tight could help.":diff<-1.5?"We should have the edge. Go and enjoy it.":"Evenly matched on paper.";
    const missing=S.players.filter(p=>!p.avail);
    return `<section class="card hero">${head}<h3>Match day · ${of.comp==="L"?`League · Round ${ev.round+1}`:`County Cup ${CUPNAME[ev.round]}`}</h3>
     <div class="vs">${badge(US,1)}<div style="min-width:0;flex:1"><div class="nm">${of.f.h===US?"v":"at"} ${esc(t.name)}</div><div class="sub">${of.comp==="L"&&pos&&tableRows()[0].P?`${ord(pos)} in the league · `:""}${scout}</div></div>${badge(opp,1)}</div>
     ${missing.length?`<div class="note">${missing.map(p=>`${esc(p.name)} ${esc(p.away)}`).join(". ")}.</div>`:""}
     <p style="margin:0">Your eight: ${squadIds().map(id=>esc(P(id).name)).join(", ")}. ${outIds().length?`Not in the squad: ${outIds().map(id=>esc(P(id).name)).join(", ")}.`:""}</p>${towLine}</section>`;
  }
  // Sunday: yesterday's result
  let body="";

    body=`<div class="vs">${badge(US,1)}<div style="min-width:0;flex:1"><div class="nm">Friendly: ${fr.us}–${fr.them} ${fr.res==="W"?"win":fr.res==="D"?"draw":"defeat"}</div><div class="sub">v ${esc(teamName(FRIENDLY_OPP))}${fr.log&&fr.log.some(g=>g.side==="us")?` · ⚽ ${scorerLine(fr.log,"us")}`:""}</div></div>${badge(FRIENDLY_OPP,1)}</div>`}
  if(d===0&&S.lastRes){const lr=S.lastRes;
    body=`<div class="vs">${badge(US,1)}<div style="min-width:0;flex:1"><div class="nm">${lr.tour?`${esc(lr.tour)}: ${lr.place===1?"Winners! 🏆":lr.place===2?"Runners-up 🥈":`${ord(lr.place||3)} in the group`}`:`Yesterday: ${lr.us}–${lr.them} ${lr.res==="W"?"win":lr.res==="D"?"draw":"defeat"}`}</div>
     <div class="sub">${lr.tour?`Last game ${lr.us}–${lr.them} v ${esc(teamName(lr.opp))}`:`v ${esc(teamName(lr.opp))}`}${lr.log&&lr.log.some(g=>g.side==="us")?` · ⚽ ${scorerLine(lr.log,"us")}`:""}</div></div>${badge(lr.opp,1)}</div>`}
  const title=["A new week","Monday","Tuesday","","Scouting day","Squad day"][d];
  return `<section class="card hero">${head}<div class="nm" style="font:400 24px var(--display)">${esc(title)}</div>${body}
   <p style="margin:0">${satPreview()} ${d<3?"Training is on Wednesday.":""}${d===5?" Pick your eight: five to start and three subs.":""}</p>
   ${towLine}${notes}</section>`;
}

function contBtn(attr,big,sub){return `<button class="btn gold cont" ${attr}><b>${big}</b>${sub?`<small>${sub}</small>`:""}</button>`}
const SKIP_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg>';
function actBar(){
  if(S.seasonOver)return contBtn(`data-act="nextseason"`,`Start the U${Math.min(S.age+1,12)}s`);
  if(CH)return `<button class="skip" data-act="chalquit">✕<br>Give up</button>`+contBtn(`data-act="chalgo"`,"Start the challenge");
  if(S.dil)return contBtn(`data-act="seedil"`,"Decide first");
  if(S.guide===1)return contBtn(`data-act="g1"`,"Next: training");
  if(S.guide===2)return contBtn(`data-act="g2"`,"Finish");
  const ev=curEvent(),of=ourFixture(ev);const d=S.day;let main,extra=[];
  const skip=(act,where)=>`<button class="skip" data-act="${act}">${SKIP_I}Skip to ${where}</button>`;
  if(d===3&&!S.trained){main=contBtn(`data-act="train"`,"Run training");extra.push(skip("tosat","Saturday"))}
  else if(d<6){main=contBtn(`data-act="day"`,d+1===3?"To training":d+1===6?"To match day":`On to ${DAYNAME[d+1]}`);
    if(d<2)extra.push(skip("totrain","training"));
    else if(d<5)extra.push(skip("tosat","Saturday"))}
  else if(ev.type==="T"){const t=S.tours[ev.round];main=t.stage==="done"?contBtn(`data-act="endtour"`,"Head home"):contBtn(`data-act="play"`,t.stage==="final"?"Play the final":"Next game");
    if(t.stage!=="done"&&view!=="tactics")extra.push(`<button class="btn ghost" data-view="tactics">Pick your team</button>`)}
  else if(!of.f)main=contBtn(`data-act="skip"`,"On to next week");
  else{main=contBtn(`data-act="play"`,"Go to the match");if(view!=="tactics")extra.push(`<button class="btn ghost" data-view="tactics">Pick your team</button>`)}
  return extra.join("")+main;
}
function matchBar(){

    st==="paused"?contBtn(`data-m="go"`,"Carry on"):st==="break"?contBtn(`data-m="go"`,"Second half"):

function setBar(){const el=$("#actbar");if(!el)return;const h=view==="match"&&M?matchBar():actBar();if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=`<div class="wrap in">${h}</div>`}}
function tourHero(ev,head){
  const t=S.tours[ev.round];const tb=tourTable(t);const nx=tourNext(t);
  const fxl=[...t.fx,...(t.final?[t.final]:[])];
  const table=`<div class="scroll"><table class="tbl" style="color:inherit"><thead><tr><th class="l">Group</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>${tb.map(r=>`<tr${r.id===US?' style="font-weight:800"':""}><td class="l">${esc(teamName(r.id))}</td><td>${r.P}</td><td>${r.F-r.A>0?"+":""}${r.F-r.A}</td><td>${r.Pts}</td></tr>`).join("")}</tbody></table></div>`;

  S.mlog.push({d:curDate(),opp:m.opp,comp:m.comp,len:m.half*2,mins,away:S.players.filter(p=>!p.avail).map(p=>p.id)});if(S.mlog.length>12)S.mlog.splice(0,S.mlog.length-12)}
function rotateTips(){
  const tips=[];const log=(S.mlog||[]).slice(-5);const av=S.players.filter(p=>p.avail);
  av.filter(p=>p.dropped>0).sort((a,b)=>b.dropped-a.dropped).forEach(p=>tips.push(`${p.name} has been left out ${p.dropped>1?`${p.dropped} weeks running`:"of the last squad"}. Bring her into the eight.`));
  av.filter(p=>(p.benchRun||0)>=2).forEach(p=>tips.push(`${p.name} has had less than half a game ${p.benchRun} times in a row. Start her, or plan her more minutes.`));
  if(log.length>=2){const tot=p=>log.reduce((a,g)=>a+(g.mins[p.id]||0),0);const s=av.slice().sort((a,b)=>tot(b)-tot(a));const max=log.reduce((a,g)=>a+g.len,0);
    if(s.length&&tot(s[0])>=max*.85)tips.push(`${s[0].name} has played ${tot(s[0])} of the last ${max} minutes. She could start on the bench to share it out.`)}
  return tips;
}

// ---- substitution planner ----
const PLAN_N={off:"Off",equal:"Equal minutes",rotate:"Rotate positions",manual:"Manual"};
const PLAN_D={off:"No planned changes. You make the subs yourself during the game.",equal:"Shares the minutes out as evenly as it can. Changes happen at the quarter points of each half, and nobody comes off straight after going on.",rotate:"Equal minutes, and at half-time the outfield girls swap positions so they try somewhere new.",manual:"You choose each change: the minute, who comes on and who goes off."};
// change points: each quarter of a half (or the middle of a short half), plus half-time
function planBounds(half){const q=half>=12?[.25,.5,.75]:[.5];const b=[];[0,half].forEach(h0=>{q.forEach(f=>b.push(h0+Math.round(half*f)));if(!h0)b.push(half)});return [...new Set(b)].sort((a,c)=>a-c)}
function nextHalf(){if(friendlyOpen())return 10;const ev=curEvent();return ev&&ev.type==="T"?7:20}
// one change: the girl coming on takes the spot of the girl going off (or they swap if both are on)
function applyCh(xi,ch){const i=ch.off!=null?xi.indexOf(ch.off):ch.i;if(i==null||i<0)return false;const j=xi.indexOf(ch.on);if(j===i)return false;if(j>=0)[xi[i],xi[j]]=[xi[j],xi[i]];else xi[i]=ch.on;return true}
function perms(a){if(a.length<2)return [a.slice()];const r=[];a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(q=>r.push([x,...q])));return r}
// the changes at minute t for equal minutes or rotate positions; L is how long until the next change point
function planStep(xi,mins,t,L,half,plan,squad,formKey){
  const form=FORMS[formKey];const out=[];const doCh=(on,i)=>{const ch={on,off:xi[i]||null,i,sw:xi.includes(on)};if(applyCh(xi,ch))out.push(ch)};
  const gi=form.findIndex(s=>s[0]==="GK");const prev={};xi.forEach((id,i)=>{if(id)prev[id]=form[i][3]});
  if(t===half&&plan.gk&&gi>=0){const cur=xi[gi];const alt=squad.filter(id=>id!==cur&&P(id).posD.includes("GK")).sort((a,b)=>mins[a]-mins[b])[0];if(alt)doCh(alt,gi)}
  const kp=xi[gi];const slots=form.map((s,i)=>i).filter(i=>i!==gi);const onNow=new Set(slots.map(i=>xi[i]).filter(Boolean));
  // fewest minutes first; girls already on get a stint's head start so changes aren't constant
  const key=id=>mins[id]-(onNow.has(id)?L:0);
  const pool=squad.filter(id=>id!==kp).sort((a,b)=>key(a)-key(b)||onNow.has(b)-onNow.has(a));
  const chosen=new Set(pool.slice(0,slots.length));const incoming=pool.filter(id=>chosen.has(id)&&!onNow.has(id));
  slots.forEach(i=>{if(xi[i]&&chosen.has(xi[i])||!incoming.length)return;let bk=0,bv=-1;incoming.forEach((id,k)=>{const v=fitFor(P(id),form[i]);if(v>bv){bv=v;bk=k}});doCh(incoming.splice(bk,1)[0],i)});
  if(plan.mode==="rotate"&&t===half){const ids=slots.map(i=>xi[i]);
    if(ids.every(Boolean)){let best=ids,bs=-1e9;for(const pm of perms(ids)){let sc=0;pm.forEach((id,k)=>{const sl=form[slots[k]],p=P(id);sc+=fitFor(p,sl)/4+(prev[id]&&prev[id]!==sl[3]?3:0)+(p.posD.includes(sl[3])?1.5:0)});if(sc>bs){bs=sc;best=pm}}
      best.forEach((id,k)=>{if(xi[slots[k]]!==id)doCh(id,slots[k])})}}
  return out;
}
// play the plan through to project everyone's minutes
function simPlan(plan,xi0,squad,formKey,half){
  const xi=xi0.slice(),mins={},segs={},chs=[];squad.forEach(id=>{mins[id]=0;segs[id]=[]});const form=FORMS[formKey];
  const end=half*2,pts=[...planBounds(half),end];let t=0;
  pts.forEach((b,k)=>{xi.forEach((id,i)=>{if(!id||!(id in mins))return;mins[id]+=b-t;const sg=segs[id],c=form[i][3],last=sg[sg.length-1];if(last&&last.c===c&&last.to===t)last.to=b;else sg.push({c,from:t,to:b})});
    t=b;if(b>=end||plan.mode==="off")return;
    if(plan.mode==="manual")plan.ch.filter(c=>c.m===b).forEach(c=>{const sw=xi.includes(c.on);const ok=squad.includes(c.on)&&applyCh(xi,{on:c.on,off:c.off});chs.push({m:b,on:c.on,off:c.off,sw,bad:!ok})});
    else planStep(xi,mins,b,(pts[k+1]||end)-b,half,plan,squad,formKey).forEach(ch=>chs.push({m:b,...ch}))});
  return {mins,segs,chs,end};
}
function equalAsManual(){const sim=simPlan({mode:"equal",gk:S.tac.plan.gk},S.tac.xi,squadIds(),S.tac.form,nextHalf());return sim.chs.map(c=>({m:c.m,on:c.on,off:c.off}))}
function chText(c){const off=c.off?P(c.off):null,on=P(c.on);if(!on)return "";if(c.sw&&off)return `${esc(on.name)} and ${esc(off.name)} swap positions`;return off?`${esc(on.name)} on for ${esc(off.name)}`:`${esc(on.name)} into the empty spot`}

    <div class="btns" style="margin-top:8px"><button class="btn ghost small" data-act="plancopy">Start again from equal minutes</button></div>`:"";
  return `<section class="card" id="planCard"><h3>Sub plan</h3>
   <div class="seg" role="group" aria-label="Sub plan">${Object.keys(PLAN_N).map(k=>`<button data-plan="${k}" aria-pressed="${pl.mode===k}">${PLAN_N[k]}</button>`).join("")}</div>
   <p class="hint" style="margin-top:8px">${PLAN_D[pl.mode]}${pl.mode!=="off"?" The plan runs by itself during the match, and you can still make your own changes or stop it.":""}${half!==20?` Planned for ${half}-minute halves.`:""}</p>
   ${pl.mode!=="off"&&pl.mode!=="manual"&&gks>1?`<div class="btns" style="margin-top:8px"><button class="btn ghost small" data-plangk="1" aria-pressed="${!!pl.gk}">${pl.gk?"✓ ":""}Swap keepers at half-time</button></div>`:""}
   ${pl.mode==="off"?`<p class="hint" style="margin-top:6px">Without a plan, the starting five play all ${sim.end} minutes unless you bring the subs on.</p>`:proj+tl+add}</section>`;

// before kick-off: what the plan will do, with a way to switch it off for this game
function prePlanCard(){

// a planned change during the match; returns the commentary line, or "" if it no longer fits
function planApply(ch){
  const i=ch.off!=null?M.xi.indexOf(ch.off):ch.i;if(i==null||i<0||!M.squad.includes(ch.on))return "";const j=M.xi.indexOf(ch.on);if(j===i)return "";
  const form=FORMS[M.form];const to=k=>form[k][3]==="GK"?"in goal":`to ${POSN[form[k][3]].toLowerCase()}`;
  if(j>=0){[M.xi[i],M.xi[j]]=[M.xi[j],M.xi[i]];return `🔁 Sub plan: ${P(ch.on).name} goes ${to(i)}${M.xi[j]?`, ${P(M.xi[j]).name} ${to(j)}`:""}.`}
  const off=M.xi[i];M.xi[i]=ch.on;return `🔁 Sub plan: ${P(ch.on).name} on for ${off?P(off).name:"the empty spot"}.`;
}

// --- player development stories: a season timeline of moments worth remembering ---
function story(id,icon,text,w){S.story=S.story||[];S.story.push({d:curDate(),season:seasonStr(),id,icon,text,w:w||1});if(S.story.length>300)S.story.splice(0,S.story.length-300);if(!CH)S.today&&S.today.push(`${icon} ${text}`)}
function matchStories(m){
  if(m.comp==="X")return;const vs=team(m.opp).name;
  m.squad.forEach(id=>{const p=P(id);const g=m.goals[id]||0,a=m.ast[id]||0;
    if(g&&!p.cr.goals&&!p.firstG){p.firstG=1;story(id,"⚽",`${p.name} scored her first ever goal, against ${vs}!`,3)}
    else if(g&&!p.ss.goals&&m.comp!=="F")story(id,"⚽",`${p.name} got her first goal of the season against ${vs}.`,1);
    if(g>=3)story(id,"🎩",`A hat-trick for ${p.name} against ${vs}!`,3);
    if(a&&!(p.cr.ast||0)&&!p.firstA){p.firstA=1;story(id,"🅰️",`${p.name} set up her first goal for a teammate.`,2)}
    if(m.potm===id&&!p.cr.potm&&m.comp!=="T"&&m.comp!=="F")story(id,"☕",`${p.name} won her first Coffey Coffee player of the match award.`,2);
    // playing a new position often enough teaches it
    const pm=m.posMin[id]||{};p.posMins=p.posMins||{};
    for(const[c,n] of Object.entries(pm)){p.posMins[c]=(p.posMins[c]||0)+n;
      if(!p.posD.includes(c)&&p.posMins[c]>=60&&c!=="GK"){p.posD.push(c);p.pos=rolesOf(p.posD);story(id,"🧭",`${p.name} has learned to play ${POSN[c].toLowerCase()}. It's now one of her positions.`,2)}}});
  const gk=m.xi[0];if(gk&&m.them===0&&(m.posMin[gk]||{}).GK>=m.half*1.5)story(gk,"🧤",`A clean sheet for ${P(gk).name} against ${vs}.`,1);
}

function addPlayer(nm,mult){const nums=new Set(S.players.map(p=>p.num));let n=5;while(nums.has(n))n++;
  const base=best7Str()*(mult||.88);const pos=pick([["D"],["LW","RW"],["ST"],["ST","LW"],["D","GK"]]);const a={};for(const[k] of ATTR)a[k]=clamp(base+rnd(-2.5,2.5)-(k==="GK"&&!pos.includes("GK")?5:0),3,20);
  const p=mkPlayer([nm.toLowerCase().replace(/\W/g,""),nm,n,pos,R()<.2?"L":"R",a,pick(TRAITS)]);p.morale=78;p.fun=82;S.players.push(p);story(p.id,"👋",`${nm} joined the squad, wearing number ${n}.`,2);return p}

let coachList=[];
function fiveStr(xi){const f=FORMS[S.tac.form];return xi.reduce((a,id,i)=>a+(id?fitFor(P(id),f[i]):0),0)/f.length}
function coachAdvice(){
  const out=[];const xi=S.tac.xi,subs=S.tac.subs.filter(Boolean),sq=squadIds(),form=FORMS[S.tac.form];const now=fiveStr(xi);
  const skip=S.coachSkip&&S.coachSkip.wk===S.wk?S.coachSkip.ks:[];const isGK=id=>P(id).posD.includes("GK");
  // a girl left out again
  const lo=outIds().map(P).filter(p=>p.dropped>=1).sort((a,b)=>b.dropped-a.dropped)[0];
  if(lo){const cands=subs.filter(id=>!(isGK(id)&&sq.filter(isGK).length<2));const w=cands.sort((a,b)=>ovr(P(a))-ovr(P(b)))[0];
    if(w)out.push({k:"lo"+lo.id,text:`Your eight leaves ${lo.name} out for a ${ord(lo.dropped+1)} game running. Bringing her in for ${P(w).name} on the bench should lift squad harmony.`,
      eff:`Likely effect: ${lo.name}'s mood and squad harmony go up. ${P(w).name} misses out this week. Your starting five doesn't change.`,btn:`Swap ${lo.name} in for ${P(w).name}`,
      apply:()=>{S.tac.subs[S.tac.subs.indexOf(w)]=lo.id;return `${lo.name} is in the eight.`}})}
  // someone out of position when a natural is on the bench
  form.forEach((sl,i)=>{const id=xi[i];if(!id||famFor(P(id),sl)>=1)return;const c=subs.filter(b=>famFor(P(b),sl)>=1&&fitFor(P(b),sl)>fitFor(P(id),sl)).sort((a,b)=>fitFor(P(b),sl)-fitFor(P(a),sl))[0];if(!c)return;
    const nx=xi.slice();nx[i]=c;const after=fiveStr(nx);
    out.push({k:"op"+id+i,text:`${P(id).name} is out of position at ${POSN[sl[3]].toLowerCase()}. ${P(c).name} plays there naturally and is on the bench.`,
      eff:`Likely effect: starting five strength ${now.toFixed(1)} → ${after.toFixed(1)}. ${P(id).name} starts on the bench instead.`,btn:`Start ${P(c).name} at ${POSN[sl[3]].toLowerCase()}`,
      apply:()=>{const j=S.tac.subs.indexOf(c);S.tac.subs[j]=id;S.tac.xi[i]=c;return `${P(c).name} starts at ${POSN[sl[3]].toLowerCase()}.`}})});
  // an unhappy girl on the bench
  const sad=subs.map(P).filter(p=>p.morale<50).sort((a,b)=>a.morale-b.morale)[0];
  if(sad){let bi=-1,bv=-1;form.forEach((sl,i)=>{if(sl[0]==="GK"&&!isGK(sad.id))return;const v=fitFor(sad,sl)-(xi[i]?fitFor(P(xi[i]),sl):0);if(xi[i]&&(bi<0||v>bv)){bi=i;bv=v}});
    if(bi>=0){const off=xi[bi];const nx=xi.slice();nx[bi]=sad.id;const after=fiveStr(nx);
      out.push({k:"sad"+sad.id,text:`${sad.name} is ${moodWord(sad.morale).toLowerCase()} at the moment. A start would mean a lot to her.`,eff:`Likely effect: her mood goes up. Starting five strength ${now.toFixed(1)} → ${after.toFixed(1)}. ${P(off).name} starts on the bench.`,
        btn:`Start ${sad.name} instead of ${P(off).name}`,apply:()=>{const j=S.tac.subs.indexOf(sad.id);S.tac.subs[j]=off;S.tac.xi[bi]=sad.id;return `${sad.name} starts this week.`}})}}
  // minutes: no plan means subs may not play
  if(S.tac.plan.mode==="off"&&subs.length)out.push({k:"plan",text:`With no sub plan, ${subs.map(id=>P(id).name).join(", ")} only play if you remember to bring them on. Girls who sit out the whole game get upset.`,
    eff:`Likely effect: everyone in the eight plays 20 to 30 minutes and harmony goes up. Your strongest five play a bit less, but their legs stay fresh.`,btn:"Use equal minutes",apply:()=>{S.tac.plan.mode="equal";return "Sub plan set to equal minutes."}});
  // approach against this opponent
  const ev=curEvent(),of=ourFixture(ev);
  if(of&&of.f&&ev.type!=="T"){const opp=of.f.h===US?of.f.a:of.f.h;const diff=team(opp).str-best7Str();
    if(diff>1.5&&S.tac.ment===2)out.push({k:"ment0",text:`${team(opp).name} are strong and you've set the team to Go for it. That leaves big gaps at the back.`,eff:"Likely effect of Keep it tight: fewer chances against, fewer for us, and legs last longer.",btn:"Switch to Keep it tight",apply:()=>{S.tac.ment=0;return "Approach: keep it tight."}});
    if(diff<-1.5&&S.tac.ment===0)out.push({k:"ment2",text:`We should have the edge on ${team(opp).name}, but you've set the team to Keep it tight.`,eff:"Likely effect of Go for it: more chances for us, a few more against, and tired legs late on.",btn:"Switch to Go for it",apply:()=>{S.tac.ment=2;return "Approach: go for it."}})}
  return out.filter(a=>!skip.includes(a.k)).slice(0,3);
}

  return `<section class="card coach"><h3>Your assistant coach says</h3><div class="stack" style="gap:8px">${coachList.map((a,i)=>`<div class="adv"><span>${esc(a.text)}</span><span class="eff">${esc(a.eff)}</span>
   <div class="btns"><button class="btn small" data-coach="${i}">${esc(a.btn)}</button><button class="btn ghost small" data-coachx="${a.k}">Keep it as it is</button></div></div>`).join("")}</div></section>`}

  give("Golden boot","👟",p=>p.ss.goals,p=>`${p.ss.goals} goal${p.ss.goals===1?"":"s"} this season.`);

  give("Effort award","💪",p=>p.ss.tow||0,p=>`Trainer of the week ${p.ss.tow} time${p.ss.tow===1?"":"s"}.`);
  give("Players' player","🌟",p=>p.ss.apps>=3?avg(p):0,p=>`The best average rating in the squad (${avg(p).toFixed(1)}).`);
  give("Ever-present","📅",p=>p.ss.apps,p=>`Played in ${p.ss.apps} games.`);
  const TA={"Quick learner":"for picking up everything we tried","Big smile":"for the biggest smile at every session","Brave tackler":"for never shying away from a tackle","Clever passer":"for the cleverest passes in the squad","Runs all day":"for running and running and running","Calm head":"for staying calm when it got busy","Goal hungry":"for always wanting the ball in the box","Safe hands":"for safe hands in goal","Lightning quick":"for leaving everyone behind","Never gives up":"for never, ever giving up"};
  ps.filter(p=>!got.has(p.id)).forEach(p=>{const st=(S.story||[]).filter(x=>x.id===p.id&&x.season===seasonStr()).sort((a,b)=>b.w-a.w)[0];

  const mm=(S.story||[]).filter(x=>x.season===seasonStr()).sort((a,b)=>b.w-a.w).slice(0,3).map(x=>`${x.icon} ${x.text}`);

function showPres(){const A=S.review&&S.review.awards;if(!A)return;const L=A.list;
  if(presIdx>=L.length){sheet(`<h3>Presentation night</h3><h2>Memorable moments</h2>${A.moments.length?`<div class="tl">${A.moments.map(m=>`<div><span>✨</span><span>${esc(m)}</span></div>`).join("")}</div>`:`<p>What a season.</p>`}
    <p style="margin:0">Every girl went home with something. Well done${S.manager?`, ${esc(S.manager)}`:""}.</p><div class="btns" style="justify-content:flex-end"><button class="btn gold" data-act="closesheet">Finish the night</button></div>`);return}
  const a=L[presIdx],p=P(a.id);
  sheet(`<h3>Presentation night · ${presIdx+1} of ${L.length}</h3><div class="award"><div class="ico">${a.icon}</div><h2>${esc(a.title)}</h2><div class="who">${p?esc(p.name):""}</div><p style="margin:0">${esc(a.why)}</p></div>
   <div class="btns" style="justify-content:flex-end"><button class="btn ghost" data-act="closesheet">Skip to the end</button><button class="btn gold" data-act="presnext">${presIdx+1<L.length?"Next award":"Memorable moments"}</button></div>`)}
function presListCard(){const A=S.review.awards;return `<section class="card"><h3>Presentation night awards</h3><div class="tl">${A.list.map(a=>`<div><span>${a.icon}</span><span><b>${esc(a.title)}: ${esc(P(a.id)?.name||"")}</b><small>${esc(a.why)}</small></span></div>`).join("")}</div></section>`}

// --- matchday feedback: what your decisions did ---
function feedback(){
  const m=M,out=[];const ours=m.goalLog.filter(g=>g.side==="us"),theirs=m.goalLog.filter(g=>g.side==="them");const end=m.half*2;
  const TALKN={pre:"Pre-match",ht:"Half-time",ft:"Full-time"};const MODN={atk:"attack",def:"defending",ctl:"passing"};
  m.dec.filter(d=>d.k==="talk"&&d.phase!=="ft").forEach(d=>out.push([d.mo>0?"good":d.mo<0?"bad":"tip2",`${TALKN[d.phase]} talk, "${d.text}": ${d.react}${d.mod?` It gave a small boost to ${Object.keys(d.mod).map(k=>MODN[k]).join(" and ")}.`:""}`]));
  const sh=m.dec.filter(d=>d.k==="shout");
  if(!sh.length&&m.state==="ft")out.push(["tip2","You didn't use any shouts. A well-timed one can tip a close game."]);
  else if(sh.length){const g=ours.filter(x=>x.sh);if(g.length)out.push(["good",`${g.length} of our goals came while a shout was working ("${SHOUTS[g[g.length-1].sh].n}").`]);
    const ag=theirs.filter(x=>x.sh&&x.sh!=="back").length;if((m.shoutN||0)>6)out.push(["bad","Too much shouting. By the end the girls had stopped listening."]);else if(!g.length&&!ag)out.push(["tip2",`You used ${sh.length} shout${sh.length>1?"s":""}, but no goals came while they were working.`])}
  m.dec.filter(d=>d.k==="ment"||d.k==="form").forEach(d=>{const f=ours.filter(g=>g.min>d.min).length,a=theirs.filter(g=>g.min>d.min).length;
    out.push([f>a?"good":f<a?"bad":"tip2",`Switching to ${d.v} at ${d.min}': ${f} scored and ${a} conceded after that.`])});
  const on=m.xi.filter(Boolean);const legs=on.length?Math.round(on.reduce((a,id)=>a+m.cond[id],0)/on.length):0;const late=theirs.filter(g=>g.min>end*.75).length;
  if(legs<55)out.push(["bad",`Tired legs by the end (${legs}% fresh on average)${late?`, and we conceded ${late} late on`:""}. Rolling subs or a sub plan would help.`]);
  else if(legs>=70&&m.squad.length>5)out.push(["good",`Fresh legs at the end (${legs}% on average), thanks to your changes.`]);
  const x0=m.xi0||m.xi;const f=FORMS[m.form];const op=x0.map((id,i)=>id&&f[i]&&famFor(P(id),f[i])<1?`${P(id).name} (${POSN[f[i][3]].toLowerCase()})`:null).filter(Boolean);
  if(op.length)out.push(["bad",`Out of position from the start: ${op.join(", ")}. They play below their best there.`]);
  const unused=m.squad.filter(id=>!m.mins[id]);const lt=m.squad.filter(id=>m.mins[id]>0&&m.mins[id]<m.half);
  if(unused.length)out.push(["bad",`${unused.map(id=>P(id).name).join(", ")} didn't get on.${m.comp==="X"?"":" Squad harmony will drop."}`]);
  else if(!lt.length&&m.squad.length>5)out.push(["good",`Everyone in the squad got at least half a game.${m.comp==="X"?"":" Squad harmony goes up."}`]);
  const pu=m.possT[0]+m.possT[1]?Math.round(m.possT[0]/(m.possT[0]+m.possT[1])*100):50;
  if(pu>=55&&m.shots[0]<5)out.push(["tip2",`Lots of the ball (${pu}%) but only ${m.shots[0]} shots. Try "Have a shot" or a front three.`]);
  if(m.shots[1]>=m.shots[0]+4)out.push(["tip2",`They had far more shots (${m.shots[1]} to ${m.shots[0]}). "Get back" or Keep it tight could help.`]);
  return out.slice(0,7);
}

// ---------------- events ----------------
document.addEventListener("click",e=>{
  const t=e.target.closest("button,tr.click");if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.view){view=d.view;tacOpen=false;playerView=null;sel=null;confirmNew=false;render();window.scrollTo({top:0});return}
  if(d.player){view="squad";playerView=d.player;render();window.scrollTo({top:0});return}
  if(d.act==="back"){playerView=null;render();return}
  if(d.act==="day"){advanceDay();if(S.dil)view="home";render();if(S.dil)window.scrollTo({top:0});return}
  if(d.act==="tosat"){const was=S.trained;jumpToSat();if(S.dil)view="home";render();if(S.dil){toast("Something needs your decision first.");return}if(!was&&S.trained)showTrainSheet();else toast("It's match day.");return}
  if(d.act==="train"){applyTraining();saveGame();render();showTrainSheet();return}
  if(d.act==="trainsheet"){showTrainSheet();return}
  if(d.coach!=null){const a=coachList[+d.coach];if(a){const msg=a.apply();saveGame();render();toast(msg)}return}
  if(d.coachx){if(!S.coachSkip||S.coachSkip.wk!==S.wk)S.coachSkip={wk:S.wk,ks:[]};S.coachSkip.ks.push(d.coachx);saveGame();render();return}
  if(d.act==="seedil"){view="home";render();window.scrollTo({top:0});return}
  if(d.dil!=null){answerDilemma(+d.dil);return}
  if(d.act==="presnight"){presIdx=0;showPres();return}
  if(d.act==="presnext"){presIdx++;showPres();return}
  if(d.chal){closeSheet();enterChallenge(d.chal);window.scrollTo({top:0});return}
  if(d.act==="chalgo"){startMatch(false,CHAL.find(c=>c.id===CH.id));window.scrollTo({top:0});return}
  if(d.act==="chalquit"){leaveChallenge();toast("Challenge abandoned. Your season is just as you left it.");return}
  if(d.act==="tlall"){tlAll=!tlAll;render();return}
  if(d.act==="closesheet"){closeSheet();return}
  if(d.act==="g0"){const v=($("#mgrName").value||"").trim().slice(0,24);if(!v){toast("Type your name first.");$("#mgrName").focus();return}S.manager=v;S.guide=1;view="tactics";sel=null;saveGame();render();window.scrollTo({top:0});return}
  if(d.act==="g1"){S.guide=2;view="training";saveGame();render();window.scrollTo({top:0});return}
  if(d.act==="g2"){S.guide=9;view="home";saveGame();render();window.scrollTo({top:0});toast(friendlyOpen()?"You're all set. Fancy a practice match?":"You're all set. Good luck, gaffer!");return}
  if(d.act==="friendly"){if(friendlyOpen()){startMatch(true);window.scrollTo({top:0})}return}
  if(d.act==="nofriendly"){S.friendly.done=true;saveGame();render();return}
  if(d.fxshow){fxShow=d.fxshow;render();return}
  if(d.fxcomp){fxComp=d.fxcomp;render();return}
  if(d.plan){const pl=S.tac.plan;pl.mode=d.plan;if(pl.mode==="manual"&&!pl.ch.length)pl.ch=equalAsManual();saveGame();render();return}
  if(d.plangk){S.tac.plan.gk=!S.tac.plan.gk;saveGame();render();return}
  if(d.plandel!=null){S.tac.plan.ch.splice(+d.plandel,1);saveGame();render();return}
  if(d.act==="plancopy"){S.tac.plan.ch=equalAsManual();saveGame();render();toast("Copied the equal-minutes plan. Edit it as you like.");return}
  if(d.act==="planadd"){const m=+$("#plM").value,on=$("#plOn").value,off=$("#plOff").value;if(!on||!off||on===off){toast("Pick who comes on and who goes off.");return}
    S.tac.plan.ch.push({m,on,off});S.tac.plan.ch.sort((a,b)=>a.m-b.m);saveGame();render();return}
  if(d.act==="endtour"){S.lastRes=S.lastRes;nextWeek();render();window.scrollTo({top:0});return}
  if(d.act==="play"){startMatch();window.scrollTo({top:0});return}
  if(d.act==="skip"){skipWeek();toast("On to next week.");return}
  if(d.act==="auto"){autoPick(false);sel=null;saveGame();render();toast("Best eight picked.");return}
  if(d.act==="share"){autoPick(true);sel=null;saveGame();render();toast("Squad rotated: girls left out last time come in first.");return}
  if(d.act==="new"){confirmNew=true;render();return}
  if(d.act==="newgo"){confirmNew=false;newGame(S.manager);view="home";render();toast("New game started.");return}
  if(d.act==="nextseason"){nextSeason();window.scrollTo({top:0});return}
  if(d.msg){openMsg(+d.msg);return}
  if(d.inav){const i=S.inbox.findIndex(m=>m.id===inboxOpen);
    if(d.inav==="close"){inboxOpen=null;render();scrollInbox();return}
    if(d.inav==="prev"&&i>0)openMsg(S.inbox[i-1].id);
    if(d.inav==="next"&&i<S.inbox.length-1)openMsg(S.inbox[i+1].id);
    if(d.inav==="unread"){const n=S.inbox.find((m,j)=>!m.read&&j>i)||S.inbox.find(m=>!m.read);if(n)openMsg(n.id)}
    return}
  if(d.act==="save"){saveGame();toast("Game saved.");if(view==="home")render();return}
  if(d.act==="setname"||d.act==="rename"){const v=($(d.act==="setname"?"#mgrName":"#mgrEdit").value||"").trim().slice(0,24);if(!v){toast("Type your name first.");return}S.manager=v;saveGame();render();toast(`Welcome, ${v}.`);return}
  if(d.act==="celebrated"){S.celebrate=null;saveGame();render();return}
  if(d.act==="copycode"){const ta=$("#saveCode");ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}
    if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast("Backup code copied."),()=>toast(ok?"Backup code copied.":"Select the code and copy it."));else toast(ok?"Backup code copied.":"Select the code and copy it.");return}
  if(d.act==="loadcode"){try{const x=JSON.parse(decodeURIComponent(escape(atob($("#loadCode").value.trim()))));if(!x||x.v!==3||!x.players)throw 0;S=x;migrate();saveGame();view="home";render();toast("Game loaded.")}catch(e){toast("That code didn't work. Check it was copied in full.")}return}
  if(d.act==="inboxall"){inboxAll=!inboxAll;render();return}
  if(d.act==="totrain"){jumpTo(3);render();toast("It's training night.");return}
  if(d.cap){S.tac.cap=d.cap;saveGame();render();toast(`${P(d.cap).name} is captain this week.`);return}
  if(d.form){S.tac.form=d.form;tacOpen=true;saveGame();render();return}
  if(d.ment){S.tac.ment=+d.ment;tacOpen=true;saveGame();render();return}
  if(d.train){S.train.focus=d.train;saveGame();render();return}
  if(d.int){S.train.int=+d.int;saveGame();render();return}
  if(view==="tactics"&&(d.slot!=null||d.sub!=null||d.out)){const k=d.slot!=null?`s${d.slot}`:d.sub!=null?`u${d.sub}`:`o${d.out}`;
    if(!sel){sel=k}else if(sel===k){sel=null}else if(sel[0]==="o"&&k[0]==="o"){sel=k}else{swapTac(sel,k);sel=null;saveGame()}render();return}
  // match
  if(view==="match"&&M){
    if(d.m==="go"){if(M.state==="break"&&!M.flip){M.flip=true;feed("Second half! The teams have swapped ends.","brk");drawPitch()}
      M.state="live";if(M.min===0){feed(`Kick-off! ${M.weather}.`,"brk");M.xi0=M.xi.slice()}M.selTok=null;M.an&&(M.an.nextPass=performance.now()/1000+.6);runTimer();renderMatch();return}
    if(d.m==="pause"){stopTimer();M.state="paused";renderMatch();return}
    if(d.m==="planoff"){M.plan=null;M.queue=M.queue.filter(b=>!(b.meta&&b.meta.kind==="plan"));toast("Sub plan stopped for this game.");renderMatch();return}
    if(d.m==="done"){finishMatch();window.scrollTo({top:0});return}
    if(d.m==="rotate"){const n=autoRotate();toast(n?`${n} change${n>1?"s":""} made.`:"Nobody needs a rest right now.");renderMatch();return}
    if(d.speed){M.speed=+d.speed;if(M.state==="live")runTimer();renderMatch();return}
    if(d.shout&&(M.state==="live"||M.state==="paused")&&M.min>=(M.shoutCd||0)){const v=SHOUTS[d.shout];M.shoutN=(M.shoutN||0)+1;M.shout={k:d.shout,until:M.min+5};M.shoutCd=M.min+2;
      const on=onPitch();
      if(d.shout==="encourage")on.forEach(id=>{P(id).morale=clamp(P(id).morale+2,0,100)});
      if(d.shout==="praise")on.forEach(id=>{const p=P(id);p.fun=clamp(p.fun+2,0,100);p.morale=clamp(p.morale+1,0,100)});
      if(M.shoutN===7)on.forEach(id=>{P(id).fun=clamp(P(id).fun-3,0,100)});
      M.dec.push({k:"shout",min:M.min,v:d.shout});feed(`📣 You shout: "${v.say}"`,"shout");const r=pick(on.map(id=>P(id).name));
      if(M.shoutN<=6&&R()<.6)feed(pick([`${r} gives you a thumbs up.`,`The girls look over and nod.`,`${r} shouts back "OK!"`]),"");
      if(M.shoutN===7)feed("The girls have stopped listening to all the shouting.","");
      renderMatch();return}
    if(d.talk){const[ph,k]=d.talk.split(":");if(!M.talks[ph]){doTalk(ph,k);renderMatch()}return}
    if(d.mform){M.form=d.mform;M.dec.push({k:"form",min:M.min,v:d.mform,us:M.us,them:M.them});feed(`Formation change to ${d.mform}.`);snapPitch();renderMatch();return}
    if(d.mment){M.ment=+d.mment;M.dec.push({k:"ment",min:M.min,v:MENT[+d.mment],us:M.us,them:M.them});feed(`New instructions: ${MENT[+d.mment].toLowerCase()}.`);renderMatch();return}
    if(d.moff!=null&&M.state!=="ft"){const b=M.selTok&&M.selTok[0]==="b"?M.selTok:null;M.selTok=null;if(b&&d.moff!=="x"){swapMatch(b,`s${d.moff}`);updateMPitch()}renderMatch();return}
    if(d.mbench&&M.state==="live"){stopTimer();M.state="paused";M.selTok=`b${d.mbench}`;renderMatch();document.getElementById("subsCard")?.scrollIntoView({block:"nearest",behavior:"smooth"});return}
    if(M.state!=="live"&&M.state!=="ft"&&(d.slot!=null||d.mbench)){const k=d.slot!=null?`s${d.slot}`:`b${d.mbench}`;
      if(!M.selTok)M.selTok=k;else if(M.selTok===k)M.selTok=null;else if(M.selTok[0]==="b"&&k[0]==="b")M.selTok=k;else{swapMatch(M.selTok,k);M.selTok=null}
      renderMatch();return}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="indiv"){if(t.value)S.train.indiv[t.dataset.indiv]=t.value;else delete S.train.indiv[t.dataset.indiv];saveGame();toast("Extra coaching set.");return}
  if(t.id==="capSel"){S.tac.cap=t.value;tacOpen=true;saveGame();render();return}
});

// ---------------- boot ----------------
function migrate(){
  // positions and strong foot (v8): rebase ratings on the new profiles but keep any progress
  if(!S.posV){
    for(const d of SQUAD){const p=S.players.find(x=>x.id===d[0]);
      if(!p){if(!S.players.some(x=>x.num===d[2]))S.players.push(mkPlayer(d));continue}
      for(const[k] of ATTR){const gain=(p.a[k]||0)-(p.start[k]||0);p.start[k]=d[5][k];p.a[k]=clamp(d[5][k]+Math.max(0,gain),1,20)}
      p.posD=d[3].slice();p.pos=rolesOf(p.posD);p.foot=d[4]}
    S.players.forEach(p=>{if(!p.posD){p.posD=p.pos.flatMap(r=>({GK:["GK"],DEF:["D"],MID:["LW","RW"],ATT:["ST"]}[r]||[]));p.foot=p.foot||"R"}});
    if(!FORMS[S.tac.form])S.tac.form="1-2-1";
    S.posV=1;if(S.cal&&!S.seasonOver)autoPick(false); // new positions, so re-pick the five
  }
  if(!FORMS[S.tac.form])S.tac.form="1-2-1";
  if(!S.leagueIds){S.div=1;S.leagueIds=LEAGUE_T.map(t=>t[0])}
  S.trophies=S.trophies||[];if(S.manager==null)S.manager="";ensureTeams();
  if(S.guide==null)S.guide=S.manager||S.wk>0||S.day>0?9:0;
  if(!S.friendly)S.friendly={done:!(S.wk===0&&S.day===0&&!S.lastRes&&!(S.hist||[]).length)};
  if(!S.mlog)S.mlog=[];if(!S.story)S.story=[];S.players.forEach(p=>{p.posMins=p.posMins||{}});if(!S.tac.plan)S.tac.plan={mode:"off",gk:true,ch:[]};
}
function start(data){
  S=(data&&data.S)||loadGame();
  if(!S||S.v!==3)newGame();
  migrate();
  if(data&&data.view&&data.view!=="match")view=data.view;
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,view}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
